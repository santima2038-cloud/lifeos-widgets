<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<link rel="stylesheet" href="style.css">
<style>
  .card { text-align: center; }
  .modos { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .modos button { font-size: 12px; padding: 4px 10px; }
  .anillo { position: relative; width: 170px; height: 170px; margin: 14px auto 10px; }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  circle { fill: none; stroke-width: 7; }
  .fondo { stroke: var(--line); }
  .avance { stroke: var(--warn); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .descanso .avance { stroke: var(--good); }
  #tiempo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .acciones { display: flex; gap: 8px; justify-content: center; }
  #ronda { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="modos">
    <button data-min="25" data-tipo="foco" class="on">Foco 25</button>
    <button data-min="5" data-tipo="descanso">Pausa 5</button>
    <button data-min="15" data-tipo="descanso">Pausa 15</button>
  </div>
  <div class="anillo">
    <svg viewBox="0 0 100 100"><circle class="fondo" cx="50" cy="50" r="44"/><circle class="avance" id="avance" cx="50" cy="50" r="44"/></svg>
    <div id="tiempo">25:00</div>
  </div>
  <div class="acciones">
    <button id="play">Iniciar</button>
    <button id="reset">Reiniciar</button>
  </div>
  <div id="ronda">Pomodoros hoy: 0</div>
</div>
<script>
  const C = 2 * Math.PI * 44;
  const avance = document.getElementById('avance');
  const tiempo = document.getElementById('tiempo');
  const play = document.getElementById('play');
  const card = document.getElementById('card');
  const ronda = document.getElementById('ronda');
  avance.style.strokeDasharray = C;
  let total = 25 * 60, quedan = total, timer = null, tipo = 'foco', fin = 0;
  const hoy = new Date().toDateString();
  let hechos = 0;
  try { const g = JSON.parse(localStorage.getItem('pomodoros') || '{}'); if (g.dia === hoy) hechos = g.n; } catch (e) {}
  ronda.textContent = `Pomodoros hoy: ${hechos}`;

  function pintar() {
    const m = Math.floor(quedan / 60), s = quedan % 60;
    tiempo.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    avance.style.strokeDashoffset = C * (1 - quedan / total);
  }
  function sonar() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.25, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
      });
    } catch (e) {}
  }
  function parar() { clearInterval(timer); timer = null; play.textContent = 'Iniciar'; }
  function correr() {
    fin = Date.now() + quedan * 1000;
    timer = setInterval(() => {
      quedan = Math.max(0, Math.round((fin - Date.now()) / 1000));
      pintar();
      if (quedan === 0) {
        parar(); sonar();
        if (tipo === 'foco') {
          hechos++; ronda.textContent = `Pomodoros hoy: ${hechos}`;
          try { localStorage.setItem('pomodoros', JSON.stringify({ dia: hoy, n: hechos })); } catch (e) {}
        }
      }
    }, 250);
    play.textContent = 'Pausar';
  }
  play.onclick = () => { if (timer) parar(); else { if (quedan === 0) quedan = total; correr(); } };
  document.getElementById('reset').onclick = () => { parar(); quedan = total; pintar(); };
  document.querySelectorAll('.modos button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.modos button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    parar();
    tipo = b.dataset.tipo;
    card.classList.toggle('descanso', tipo === 'descanso');
    total = quedan = Number(b.dataset.min) * 60;
    pintar();
  });
  pintar();
</script>
</body>
</html>
