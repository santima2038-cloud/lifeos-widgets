<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progreso</title>
<link rel="stylesheet" href="style.css">
<style>
  .fila { margin-top: 14px; }
  .fila:first-of-type { margin-top: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .top b { font-weight: 600; }
  .top span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .barra { margin-top: 6px; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .lleno { height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
  const c = document.getElementById('c');
  function pct(inicio, fin, ahora) { return Math.min(100, Math.max(0, (ahora - inicio) / (fin - inicio) * 100)); }
  function calc() {
    const n = new Date();
    const dia0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    const dia1 = new Date(dia0); dia1.setDate(dia1.getDate() + 1);
    const lunes = new Date(dia0); lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
    const lunes2 = new Date(lunes); lunes2.setDate(lunes2.getDate() + 7);
    const mes0 = new Date(n.getFullYear(), n.getMonth(), 1);
    const mes1 = new Date(n.getFullYear(), n.getMonth() + 1, 1);
    const ano0 = new Date(n.getFullYear(), 0, 1);
    const ano1 = new Date(n.getFullYear() + 1, 0, 1);
    const diaDelAno = Math.floor((dia0 - ano0) / 864e5) + 1;
    const diasAno = Math.round((ano1 - ano0) / 864e5);
    return [
      ['Día', pct(dia0, dia1, n)],
      ['Semana', pct(lunes, lunes2, n)],
      ['Mes', pct(mes0, mes1, n)],
      [`Año · día ${diaDelAno} de ${diasAno}`, pct(ano0, ano1, n)],
    ];
  }
  function pintar() {
    c.innerHTML = calc().map(([nombre, p]) => `
      <div class="fila">
        <div class="top"><b>${nombre}</b><span>${p.toFixed(0)} %</span></div>
        <div class="barra"><div class="lleno" style="width:${p}%"></div></div>
      </div>`).join('');
  }
  pintar();
  setInterval(pintar, 60000);
</script>
</body>
</html>
